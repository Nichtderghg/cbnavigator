<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CB Navigator 3.0</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#1f1f1f;
    color:white;
}

header{
    background:#c40000;
    padding:20px;
    text-align:center;
    font-size:32px;
    font-weight:bold;
}

.container{
    padding:20px;
}

.box{
    background:#2d2d2d;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
}

h2{
    margin-top:0;
    color:#ff4d4d;
}

select,input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#3a3a3a;
    color:white;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    background:#c40000;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#ff0000;
}

.resultBox{
    background:#3a3a3a;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
}

.routeBox{
    background:#444;
    padding:12px;
    border-radius:10px;
    margin-top:10px;
}

.live{
    color:#00ff99;
    font-weight:bold;
}

.small{
    color:#bbbbbb;
    font-size:14px;
}

</style>
</head>

<body>

<header>
🚆 CB Navigator 3.0
</header>

<div class="container">

<!-- ROUTENSUCHE -->

<div class="box">

<h2>🔍 Verbindung suchen</h2>

<label>Von:</label>
<select id="von" required></select>

<label>Nach:</label>
<select id="bis" required></select>

<label>Abfahrtszeit:</label>
<input type="time" id="zeit" value="11:00">

<button onclick="routeSuchen()">
🚉 Verbindung suchen
</button>

<div id="results"></div>

</div>

<!-- GESPEICHERTE STRECKEN -->

<div class="box">

<h2>📌 Gespeicherte Reisen</h2>

<div id="savedRoutes"></div>

</div>

</div>

<script>

/* =====================================
   🚆 CB NETZ
===================================== */

const lines = [

{
    name:"RE11",
    direction:"Berlin Hbf",

    stations:[
        "Schöningen Hbf",
        "SHÖ-Markt",
        "Alter Bahnhof",
        "Lucuya Bahnhof",
        "Hötensleben (SHÖ)",
        "Ausleben",
        "Oschersleben (Bode)",
        "MD-Buckau",
        "Magdeburg Hbf",
        "Neustadt",
        "Burg (Magdeburg)",
        "Genthin",
        "Brandenburg Hbf",
        "Potsdam Hbf",
        "Berlin Hbf"
    ]
},

{
    name:"CE+1",
    direction:"Schöningen Hbf",

    stations:[
        "Bärendorf Hbf",
        "Carlaria West",
        "BÄ-Ost",
        "Bad Benen",
        "Augsburg Hbf",
        "Nürnberg Hbf",
        "Hof Hbf",
        "Leipzig Hbf",
        "Halle (Saale) Hbf",
        "Schöningen Hbf"
    ]
},

{
    name:"RB49",
    direction:"Helmstedt",

    stations:[
        "Schöppenstedt",
        "Gr Dahlum",
        "Wobeck (SHÖ)",
        "Schöningen Hbf",
        "SHÖ-Markt",
        "Frellstedt",
        "Helmstedt"
    ]
},

{
    name:"RE51",
    direction:"Hildesheim Hbf",

    stations:[
        "Schöningen Hbf",
        "Wobeck (SHÖ)",
        "Schöppenstedt",
        "Wolfenbüttel",
        "Braunschweig Hbf",
        "Lengede Broistedt",
        "Lengede Nord",
        "Burgdorf (b Hildesheim)",
        "Ottbergen",
        "Hildesheim Ost",
        "Hildesheim Hbf"
    ]
},

{
    name:"RB45",
    direction:"Schöppenstedt",

    stations:[
        "Braunschweig Hbf",
        "Wolfenbüttel",
        "Dettum",
        "Schöppenstedt"
    ]
}

];

/* =====================================
   🚉 STATIONEN SAMMELN
===================================== */

const allStations = [];

lines.forEach(line=>{

    line.stations.forEach(station=>{

        if(!allStations.includes(station)){
            allStations.push(station);
        }

    });

});

allStations.sort();

/* =====================================
   🕸️ STATIONSGRAPH
===================================== */

function stationsGraphBauen(){

    const graph = {};

    lines.forEach(line=>{

        line.stations.forEach((station,index)=>{

            if(!graph[station]){
                graph[station] = [];
            }

            const nextStation =
            line.stations[index + 1];

            if(!nextStation) return;

            const edge = {
                from: station,
                to: nextStation,
                lineName: line.name
            };

            const reverseEdge = {
                from: nextStation,
                to: station,
                lineName: line.name
            };

            graph[station].push(edge);

            if(!graph[nextStation]){
                graph[nextStation] = [];
            }

            graph[nextStation].push(reverseEdge);

        });

    });

    return graph;

}

const stationsGraph =
stationsGraphBauen();

function routeMitBfsFinden(von,bis){

    const queue = [
        {
            station: von,
            path: []
        }
    ];

    const visited =
    new Set([von]);

    while(queue.length > 0){

        const current =
        queue.shift();

        if(current.station === bis){
            return current.path;
        }

        const edges =
        stationsGraph[current.station] || [];

        edges.forEach(edge=>{

            if(visited.has(edge.to)) return;

            visited.add(edge.to);

            queue.push({
                station: edge.to,
                path: [
                    ...current.path,
                    edge
                ]
            });

        });

    }

    return null;

}

function routeInAbschnitteGruppieren(route){

    const sections = [];

    route.forEach(edge=>{

        const lastSection =
        sections[sections.length - 1];

        if(
            lastSection &&
            lastSection.lineName === edge.lineName
        ){

            lastSection.to = edge.to;

        }else{

            sections.push({
                lineName: edge.lineName,
                from: edge.from,
                to: edge.to
            });

        }

    });

    return sections;

}

/* =====================================
   🔽 DROPDOWNS
===================================== */

const vonSelect =
document.getElementById("von");

const bisSelect =
document.getElementById("bis");

function dropdownFuellen(select, placeholder){

    select.innerHTML = "";

    const placeholderOption =
    document.createElement("option");

    placeholderOption.value = "";
    placeholderOption.textContent = placeholder;
    placeholderOption.disabled = true;
    placeholderOption.selected = true;

    select.appendChild(placeholderOption);

    allStations.forEach(station=>{

        const option =
        document.createElement("option");

        option.value = station;
        option.textContent = station;

        select.appendChild(option);

    });

}

dropdownFuellen(
    vonSelect,
    "Startbahnhof auswählen"
);

dropdownFuellen(
    bisSelect,
    "Zielbahnhof auswählen"
);

/* =====================================
   ⏱ ZEITMODELL
===================================== */

const FAHRZEIT_PRO_ABSCHNITT = 5;
const MINDEST_UMSTIEGSZEIT = 5;

function zeitInMinuten(zeit){

    const [stunden,minuten] =
    zeit.split(":").map(Number);

    return stunden * 60 + minuten;

}

function minutenAlsZeit(minutenGesamt){

    const minutenProTag = 24 * 60;

    const minutenNormalisiert =
    ((minutenGesamt % minutenProTag) + minutenProTag) % minutenProTag;

    const stunden =
    Math.floor(minutenNormalisiert / 60);

    const minuten =
    minutenNormalisiert % 60;

    return `${String(stunden).padStart(2,"0")}:${String(minuten).padStart(2,"0")}`;

}

function fahrzeitBerechnen(startIndex,endIndex){

    return (endIndex - startIndex) * FAHRZEIT_PRO_ABSCHNITT;

}

/* =====================================
   🔍 ROUTE SUCHEN
===================================== */

function routeSuchen(){

    const von =
    vonSelect.value;

    const bis =
    bisSelect.value;

    const zeit =
    document.getElementById("zeit").value;

    const results =
    document.getElementById("results");

    results.innerHTML = "";

    if(!von || !bis){

        results.innerHTML =
        "<p class='small'>Bitte Start und Ziel auswählen</p>";

        return;

    }

    let found = false;
    const startMinuten =
    zeitInMinuten(zeit);

    let resultCount = 0;

    function hatStationsbewegung(startIndex, endIndex){

        return startIndex < endIndex || startIndex > endIndex;

    }

    function richtungFuer(line, startIndex, endIndex){

        if(startIndex < endIndex){
            return line.direction;
        }

        return line.reverseDirection || line.stations[0];

    }

    /* =========================
       DIREKTVERBINDUNGEN
    ========================= */

    const route =
    routeMitBfsFinden(von,bis);

    if(!route){

        results.innerHTML =
        "<p class='small'>Keine Verbindung gefunden</p>";

        return;

    }

    const sections =
    routeInAbschnitteGruppieren(route);

    const sectionHtml =
    sections.map((section,index)=>`

        <p>
        🚆 ${section.lineName}
        von
        <b>${section.from}</b>
        bis
        <b>${section.to}</b>
        </p>

        ${
            index < sections.length - 1
                ? `<p>🚉 Umstieg: <b>${section.to}</b></p>`
                : ""
        }

    `).join("");

    const zielAnkunft =
    minutenAlsZeit(
        startMinuten + (route.length * FAHRZEIT_PRO_ABSCHNITT)
    );

    results.innerHTML += `

    <div class="resultBox">

    <h2 class="live">
    ${sections.length === 1 ? "🚆 Direktverbindung" : "🔄 Umstieg möglich"}
    </h2>

    ${sectionHtml}

    <p>
    ⏱ Abfahrt:
    <b>${zeit}</b>
    </p>

    <p>
    🏁 Ankunft Ziel:
    <b>${zielAnkunft}</b>
    </p>

    <button onclick="
    streckeSpeichern(
        '${sections.length === 1 ? sections[0].lineName : "Umstieg"}',
        '${von}',
        '${bis}',
        '${zeit}'
    )
    ">
    📌 Reise speichern
    </button>

    </div>

    `;

}

/* =====================================
   📌 REISE SPEICHERN
===================================== */

function streckeSpeichern(name, von, bis, zeit){

    const authUrl = new URL(
    'https://c9c5dc9f-7a0a-4a6b-86be-cf4d681d9754-00-3ilzyfeh60vrr.janeway.replit.dev/authorize'
    );

    authUrl.searchParams.set(
        'name',
        name
    );

    authUrl.searchParams.set(
        'von',
        von
    );

    authUrl.searchParams.set(
        'bis',
        bis
    );

    authUrl.searchParams.set(
        'zeit',
        zeit
    );

    authUrl.searchParams.set(
        'app',
        'CB Navigator'
    );

    authUrl.searchParams.set(
        'redirect_uri',
        window.location.href
    );

    window.location.href =
    authUrl.toString();

}

/* =====================================
   📥 AUTH RÜCKGABE
===================================== */

const params =
new URLSearchParams(window.location.search);

if(params.get("authorized") === "true"){

    const route = {

        name:
        params.get("name"),

        von:
        params.get("von"),

        bis:
        params.get("bis"),

        zeit:
        params.get("zeit")

    };

    let routes =
    JSON.parse(
        localStorage.getItem(
            "cb_saved_routes"
        ) || "[]"
    );

    routes.push(route);

    localStorage.setItem(
        "cb_saved_routes",
        JSON.stringify(routes)
    );

    window.history.replaceState(
        {},
        document.title,
        window.location.pathname
    );

}

/* =====================================
   📌 GESPEICHERTE REISEN
===================================== */

function ladeReisen(){

    const saved =
    document.getElementById(
        "savedRoutes"
    );

    saved.innerHTML = "";

    const routes =
    JSON.parse(
        localStorage.getItem(
            "cb_saved_routes"
        ) || "[]"
    );

    if(routes.length === 0){

        saved.innerHTML =
        "<p class='small'>Keine gespeicherten Reisen</p>";

        return;

    }

    routes.forEach(route=>{

        saved.innerHTML += `

        <div class="routeBox">

        🚆 <b>${route.name}</b><br>

        ${route.von}
        ➜
        ${route.bis}<br>

        ⏱ ${route.zeit}

        </div>

        `;

    });

}

ladeReisen();

</script>

</body>
</html>
