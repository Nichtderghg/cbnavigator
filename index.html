/* =====================================
   🕸️ STATIONSGRAPH
===================================== */

function stationsGraphBauen(){

    const graph = {};

    lines.forEach(line=>{

        line.stations.forEach((station,index)=>{

            if(!graph[station]){
                graph[station] = [];
            }

            const nextStation =
            line.stations[index + 1];

            if(!nextStation) return;

            const edge = {
                from: station,
                to: nextStation,
                lineName: line.name
            };

            const reverseEdge = {
                from: nextStation,
                to: station,
                lineName: line.name
            };

            graph[station].push(edge);

            if(!graph[nextStation]){
                graph[nextStation] = [];
            }

            graph[nextStation].push(reverseEdge);

        });

    });

    return graph;

}

const stationsGraph =
stationsGraphBauen();

function routeMitBfsFinden(von,bis){

    const queue = [
        {
            station: von,
            path: []
        }
    ];

    const visited =
    new Set([von]);

    while(queue.length > 0){

        const current =
        queue.shift();

        if(current.station === bis){
            return current.path;
        }

        const edges =
        stationsGraph[current.station] || [];

        edges.forEach(edge=>{

            if(visited.has(edge.to)) return;

            visited.add(edge.to);

            queue.push({
                station: edge.to,
                path: [
                    ...current.path,
                    edge
                ]
            });

        });

    }

    return null;

}

function routeInAbschnitteGruppieren(route){

    const sections = [];

    route.forEach(edge=>{

        const lastSection =
        sections[sections.length - 1];

        if(
            lastSection &&
            lastSection.lineName === edge.lineName
        ){

            lastSection.to = edge.to;

        }else{

            sections.push({
                lineName: edge.lineName,
                from: edge.from,
                to: edge.to
            });

        }

    });

    return sections;

}

const FAHRZEIT_PRO_ABSCHNITT = 5;
const MINDEST_UMSTIEGSZEIT = 5;

function zeitInMinuten(zeit){

    const [stunden,minuten] =
    zeit.split(":").map(Number);

    return stunden * 60 + minuten;

}

function minutenAlsZeit(minutenGesamt){

    const minutenProTag = 24 * 60;

    const minutenNormalisiert =
    ((minutenGesamt % minutenProTag) + minutenProTag) % minutenProTag;

    const stunden =
    Math.floor(minutenNormalisiert / 60);

    const minuten =
    minutenNormalisiert % 60;

    return `${String(stunden).padStart(2,"0")}:${String(minuten).padStart(2,"0")}`;

}

function fahrzeitBerechnen(startIndex,endIndex){

    return (endIndex - startIndex) * FAHRZEIT_PRO_ABSCHNITT;

}

        von
    );

    authUrl.searchParams.set(
        'bis',
        bis

    authUrl.searchParams.set(
        'zeit',
        zeit
    );

    authUrl.searchParams.set(

        'CB Navigator'
    );

        window.location.href

}
